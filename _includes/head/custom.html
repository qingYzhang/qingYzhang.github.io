{% include base_path %}

<!-- start custom head snippets -->

{% assign icon_version = site.time | date: '%s' %}
<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/apple-touch-icon-custom.png?v={{ icon_version }}"/>
<link rel="icon" type="image/x-icon" href="{{ base_path }}/images/favicon-custom.ico?v={{ icon_version }}"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-custom-16x16.png?v={{ icon_version }}" sizes="16x16"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-custom-32x32.png?v={{ icon_version }}" sizes="32x32"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-custom-192x192.png?v={{ icon_version }}" sizes="192x192"/>
<link rel="manifest" href="{{ base_path }}/images/manifest.json?v={{ icon_version }}"/>
<meta name="theme-color" content="#ffffff"/>
<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css"/>


<!-- Support for MatJax -->
<script src="https://cdnjs.cloudflare.com/polyfill/v3/polyfill.min.js?features=es6"></script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

<!-- end custom head snippets -->
